<!-- #form="ngForm" is special syntax for template variables, it gives access to the form object that is managed by Angular -->
<form #form="ngForm" (ngSubmit)="onSubmit(form)">
  <h2>Login</h2>

  <div class="control-row">
    <div class="control no-margin">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        ngModel
        required
        email
        #email="ngModel"
      />
    </div>
    <!-- we used ngModel here to make Angular aware of this input element, so that we can use it for the template driven form -->

    <div class="control no-margin">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        ngModel
        required
        minlength="6"
        #password="ngModel"
      />
    </div>
    <!-- some directives to validate input: required, minlength and email are common -->

    <button class="button">Login</button>
  </div>

  @if (email.touched && email.dirty && email.invalid) {
    <p class="control-error">Invalid email entered</p>
  }

  @if (password.touched && password.dirty && password.invalid) {
    <p class="control-error">
      Invalid password entered, must be at least 6 characters long
    </p>
  }
</form>
