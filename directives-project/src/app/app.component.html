<main>
  <app-learning-resources />

  <hr />

  <app-auth />

  <!-- ng-template is used to wrap content that should NOT be shown initially -->
  <ng-template appAuth="admin">
    <p class="protected-content admin">Only admins should see this</p>
  </ng-template>

  <!-- a shorter way would be: -->
  <!-- <p *appAuth="admin">Only admins should see this</p> -->

  <!-- keep in mind that this does add ng-template but it also adds 2-way binding -->
  <!-- so technically it looks like this -->
  <!-- <p *[appAuth]="admin">Only admins should see this</p> -->

  <!-- so for everything to work correctly we need to do this: -->
  <!-- <p *[appAuth]="'admin'">Only admins should see this</p> -->

  <p *appAuth="'user'" class="protected-content unauthenticated">
    Regular users should see this
  </p>

  <p *appAuth="'guest'" class="protected-content guest">
    Guest users should see this
  </p>
</main>
