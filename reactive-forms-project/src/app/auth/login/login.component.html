<!-- here we connect the formGroup -->
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <h2>Login</h2>

  <!-- now we need to connect the formControl, there are 2 ways of doing it: -->
  <div class="control-row">
    <div class="control no-margin">
      <label for="email">Email</label>
      <input id="email" type="email" [formControl]="form.controls.email" />
    </div>

    <div class="control no-margin">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
    </div>

    <button class="button">Login</button>
  </div>

  @if (emailIsInvalid) {
    <p class="control-error">Please enter a valid email</p>
  }

  @if (passwordIsInvalid) {
    <p class="control-error">
      Please enter a valid password (must be at least 6 characters, and contain
      a question mark)
    </p>
  }
</form>
