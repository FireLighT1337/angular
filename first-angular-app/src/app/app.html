<app-header></app-header>
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <!-- alternatively some legacy code, pre Angular 17 -->
      <!-- <li *ngFor="let user of users"></li> -->
      <!-- then you need to import NgFor and also add it to the component imports for app.ts -->
      <li>
        <app-user
          [user]="user"
          [selected]="user.id === selectedUserId"
          (select)="onSelectUser($event)"
        />
      </li>
      <!-- $event holds emitted values, in custom and built-in events -->
    }
  </ul>

  @if (selectedUser) {
    <!-- alternative way, also need to do the same as for NgFor -->
    <!-- <app-tasks *ngIf="selectedUser; else fallback" /> -->
    <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name" />
  } @else {
    <!-- <ng-template #fallback> -->
    <p id="fallback">Select a user to see their tasks!</p>
    <!-- </ng-template> -->
  }
</main>
